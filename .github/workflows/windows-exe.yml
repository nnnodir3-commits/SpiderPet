name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Get SpiderPet sources and all 44 PNG animations
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and packaging dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Verify all original animation files
        run: python check_release_assets.py
      - name: Run original regression suite
        run: python -m unittest discover -p "test_*.py" -v
      - name: Build self-contained SpiderPet.exe
        shell: cmd
        run: >-
          python -m PyInstaller --clean --noconfirm --onefile --windowed
          --name SpiderPet
          --add-data "walk_*.png;."
          --add-data "threat_*.png;."
          spiderpet.pyw
      - name: Verify Windows executable exists
        shell: powershell
        run: |
          if (!(Test-Path 'dist/SpiderPet.exe')) { throw 'Missing dist/SpiderPet.exe' }
          Get-Item 'dist/SpiderPet.exe' | Select-Object Name,Length
      - name: Save executable as downloadable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpiderPet-v38-Windows-EXE
          path: dist/SpiderPet.exe
          if-no-files-found: error
          retention-days: 14
